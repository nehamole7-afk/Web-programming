<html>
<head>
<title> change colour </title>
</head>
<body>
<h1> Change Background </h2>
<button onclick ="changecolor()">change</button>
<script>
let color=["blue","green","yellow","orange"];
let i = 0;
function changecolor(){
document.body.style.backgroundColor = color[i];
i++;
if(i==color.length){
i=0;
}
}
</script>
</body>
</html>
