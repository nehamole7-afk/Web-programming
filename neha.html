<html>
<body bgcolor="pink">
<h1><center><i> MATHS AND STRING FUNCTIONS </i></center></h1>
<script>
var a="hello";
var b="Welcome";
var c=" I am a mca student";
document.write("string 1:" + a +"<br><br>");
document.write("string 2:" + b +"<br><br>")
document.write("string 3:" + c +"<br><br>")
document.write("<h2> STRING FUNCTIONS </h2>")
document.write("concate:" + a + b + c +"<br><br>");
document.write("tuppercase=" + a.toUpperCase() + "<br><br>");
document.write("tlowercase=" + a.toLowerCase() + "<br><br>");
document.write("replace of the string=" + a.replace(a,b) + "<br><br>");
document.write("<h2> MATH FUNCTIONS </h2>")
document.write("Round=" + Math.round(4.6) + "<br><br>");
document.write("Floor=" + Math.floor(4.9) + "<br><br>");
document.write("length=" + a.length+ "<br><br>");
document.write("Ceil=" + Math.ceil(4.1) + "<br><br>");
document.write("Square Root=" + Math.sqrt(25) + "<br><br>");
document.write("Power=" + Math.pow(2,3) + "<br><br>");
document.write("Absolute=" + Math.abs(-10) + "<br><br>");
document.write("Maximum=" + Math.max(10,20,30) + "<br><br>");
document.write("Minimum=" + Math.min(10,20,30) + "<br><br>");

</script>
</body>
</html>
